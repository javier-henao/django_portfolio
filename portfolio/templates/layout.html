{% load static %}

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Javier Henao · Portafolio{% endblock %}</title>
    <meta name="description" content="{% block description %}Portafolio de Javier Henao, ingeniero de software especializado en ciberseguridad e inteligencia artificial.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400&family=Sofia+Sans+Extra+Condensed:wght@200;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main.css' %}">
</head>
<body>

    {% include 'partials/navbar.html' %}

    <main>
        {% block content %}
        {% endblock content %}
    </main>

    <footer class="site-footer">
        <div class="container footer-grid">
            <div class="footer-brand">
                <p class="wordmark">Javier Henao</p>
                <p class="footer-role">Python FullStack Developer</p>
            </div>
            <nav class="footer-links" aria-label="Pie de página">
                <a href="{% url 'home' %}">Inicio</a>
                <a href="{% url 'blog:posts' %}">Blog</a>
                <a href="{{ cv_url }}" target="_blank" rel="noopener">CV</a>
            </nav>
            <p class="footer-note">© 2026 Javier Henao</p>
        </div>
    </footer>

</body>
</html>
